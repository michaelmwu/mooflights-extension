name: Chrome Web Store Submission

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the release ZIP and preview the request without uploading."
        required: true
        default: true
        type: boolean
      release_tag:
        description: "Published vX.Y.Z release tag whose ZIP should be submitted."
        required: true
        type: string
      publish_type:
        description: "Publish behavior after Chrome Web Store approval."
        required: true
        default: STAGED_PUBLISH
        type: choice
        options:
          - STAGED_PUBLISH
          - DEFAULT_PUBLISH
      upload_only:
        description: "Upload the package but do not submit it for review."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrome-webstore-submission
  cancel-in-progress: false

jobs:
  submit:
    name: Verify release and submit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify released Chrome ZIP
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run live submissions from main."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter a release tag like v0.0.11."
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != false ]]; then
            echo "::error::The release must be published."
            exit 1
          fi
          asset="mooflights-${RELEASE_TAG#v}.zip"
          archive="$RUNNER_TEMP/$asset"
          gh release download "$RELEASE_TAG" --pattern "$asset" --output "$archive"
          unzip -tq "$archive"
          unzip -p "$archive" manifest.json | node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const expected = process.env.RELEASE_TAG.slice(1);
            if (manifest.version !== expected) {
              throw new Error("ZIP manifest version " + manifest.version + " does not match " + expected);
            }
          '
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Submit to Chrome Web Store
        env:
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          CHROME_WEBSTORE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CHROME_WEBSTORE_UPLOAD_ONLY: ${{ inputs.upload_only && '1' || '' }}
          CHROME_WEBSTORE_PUBLISH_TYPE: ${{ inputs.publish_type }}
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
        run: node scripts/submit-chrome-webstore.mjs --artifact="$RELEASE_ARCHIVE"
